<b>${x}</b><!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1F2433">
<title>تتبع الأوردر — Twins64</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16181F;--muted:#6A6E7E;--line:#E4E2DC;--bg:#F4F3EF;--brand:#1F2433;--accent:#D9893B;--accent-soft:#FBEEDF;--green:#1E8A5A;--green-soft:#E2F3EA;--red:#C23B34}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
header{background:var(--brand);color:#fff;padding:22px 16px 64px;text-align:center}
header .co{font-weight:800;font-size:22px;letter-spacing:.5px}
header .t{opacity:.7;font-size:13.5px}
main{max-width:620px;margin:-48px auto 0;padding:0 14px 40px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06);padding:16px;margin-bottom:12px}
.find{display:flex;gap:8px}
.find input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:17px;letter-spacing:1px;text-transform:uppercase;direction:ltr;text-align:center;outline:none}
.find input:focus{border-color:var(--brand)}
.find button{border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:800;padding:0 18px;font-size:15px;cursor:pointer}
.msg{text-align:center;color:var(--muted);padding:10px 0 2px;font-size:14px}
.msg.err{color:var(--red)}
.top{display:flex;gap:14px;align-items:center}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800}
.top h1{margin:0;font-size:19px;line-height:1.35}
.top .b{color:var(--muted);font-size:13.5px}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:#8A4F12;margin-top:4px}
.pill.g{background:var(--green-soft);color:var(--green)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.facts div{background:var(--bg);border-radius:12px;padding:8px 10px}
.facts span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.facts b{font-size:15px}
h2{font-size:15px;margin:0 0 12px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;position:relative;padding-bottom:16px}
.steps li:last-child{padding-bottom:0}
.steps li:not(:last-child):before{content:"";position:absolute;right:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
.steps li.done:not(:last-child):before{background:var(--green)}
.steps .d{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;border:2px solid var(--line);background:#fff;color:var(--muted);z-index:1}
.steps .done .d{background:var(--green);border-color:var(--green);color:#fff}
.steps .active .d{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 5px rgba(217,137,59,.15)}
.steps .n{font-weight:700}
.steps .pending .n{color:var(--muted);font-weight:600}
.steps .s{font-size:12.5px;color:var(--muted)}
.bar{height:6px;background:#ECEAE4;border-radius:9px;overflow:hidden;margin-top:5px;max-width:220px}
.bar i{display:block;height:100%;background:var(--accent)}
.up{border-top:1px solid var(--line);padding:10px 0}
.up:first-of-type{border-top:0;padding-top:0}
.up .w{font-size:12px;color:var(--muted)}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#eee;cursor:zoom-in}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 4px;border-top:1px solid var(--line)}
tr:first-child td{border-top:0}
td.q{text-align:left;font-weight:700}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:9}
.zoom img{max-width:100%;max-height:100%}
.hide{display:none}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #ddd;border-top-color:var(--accent);animation:s .8s linear infinite;margin:18px auto}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><div class="co" id="co">Twins64</div><div class="t">تتبع تصنيع أوردرك لحد التسليم</div></header>
<main>
  <div class="card"><form class="find" id="f"><input id="code" placeholder="T64-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="كود التتبع"><button>تتبع</button></form><div class="msg" id="msg">اكتب كود التتبع اللي وصلك</div></div>
  <div id="out"></div>
</main>
<footer>الصفحة دي بتعرض حالة الأوردر بس، وبتتحدث أول ما المصنع يسجل أي خطوة جديدة.</footer>
<script>
/* ===== الإعداد: عنوان السيرفر والمفتاح العام (المفتاح ده عام بطبيعته ومش بيدي أي صلاحية غير التتبع بالكود) ===== */
const SUPABASE_URL = '__SUPABASE_URL__';
const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
/* ==================================================================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const d = s => s ? String(s).slice(0, 10).split('-').reverse().join('/') : '—';
const dt = s => { if (!s) return ''; const x = new Date(s); return x.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long' }) + ' — ' + x.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' }); };
const STATUS = { new: 'تم استلام الأوردر', in_production: 'جاري التصنيع', ready: 'جاهز للتسليم', shipped: 'تم الشحن', delivered: 'تم التسليم' };
const photo = p => SUPABASE_URL + '/storage/v1/object/public/progress/' + p.split('/').map(encodeURIComponent).join('/');
async function load(code) {
  const out = $('#out'), msg = $('#msg');
  msg.className = 'msg'; msg.textContent = ''; out.innerHTML = '<div class="spin"></div>';
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_tracking', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY }, SUPABASE_ANON_KEY.startsWith('eyJ') ? { Authorization: 'Bearer ' + SUPABASE_ANON_KEY } : {}), body: JSON.stringify({ p_code: code }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.message || 'error');
    if (j.error) { out.innerHTML = ''; msg.className = 'msg err'; msg.textContent = j.error === 'too_many' ? 'محاولات كتير غلط. استنى ربع ساعة وجرب تاني.' : 'الكود ده مش صحيح أو الأوردر خلص من فترة. اتأكد من الكود.'; return; }
    show(j);
    try { history.replaceState(null, '', '?c=' + encodeURIComponent(j.code)); } catch (e) {}
  } catch (e) { out.innerHTML = ''; msg.className = 'msg err'; msg.textContent = 'مش قادرين نوصل للسيرفر دلوقتي. جرب تاني بعد شوية.'; }
}
function show(o) {
  if (o.company) { $('#co').textContent = o.company; document.title = 'تتبع الأوردر — ' + o.company; }
  const p = Math.max(0, Math.min(100, o.progress || 0)), C = 2 * Math.PI * 40;
  const done = o.status === 'delivered';
  const daysLeft = o.due_date ? Math.round((new Date(o.due_date + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5) : null;
  const total = o.qty || 0;
  const firstPending = o.stages.findIndex(s => s.status === 'pending');
  const sizes = o.sizes || [];
  $('#out').innerHTML = `
  <div class="card"><div class="top">
    <div class="ring"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" stroke="#ECEAE4" stroke-width="9" fill="none"/><circle cx="48" cy="48" r="40" stroke="${done ? '#1E8A5A' : '#D9893B'}" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p / 100)}"/></svg><b>${done ? '✓' : p + '%'}</b></div>
    <div><div class="b">${esc(o.brand)} · <span class="num">${esc(o.code)}</span></div><h1>${esc(o.model)}</h1><span class="pill ${done ? 'g' : ''}">${esc(STATUS[o.status] || o.status)}</span></div></div>
    <div class="facts"><div><span>الكمية</span><b class="num">${total.toLocaleString('en-US')}</b> قطعة</div>
      <div><span>${done ? 'اتسلم' : 'التسليم المتوقع'}</span><b>${d(done ? o.delivered_at : o.due_date)}</b></div>
      <div><span>${done ? 'بدأ التصنيع' : 'باقي'}</span><b>${done ? d(o.start_date) : daysLeft == null ? '—' : daysLeft >= 0 ? daysLeft + ' يوم' : 'قريباً'}</b></div></div>
  </div>
  ${o.note ? `<div class="card note">${esc(o.note)}</div>` : ''}
  ${(o.status === 'shipped' || done) && (o.ship_carrier || o.ship_tracking) ? `<div class="card"><h2>الشحن</h2>${o.ship_carrier ? `<div>شركة الشحن: <b>${esc(o.ship_carrier)}</b></div>` : ''}${o.ship_tracking ? `<div>رقم التتبع: <b class="num">${esc(o.ship_tracking)}</b></div>` : ''}</div>` : ''}
  <div class="card"><h2>مراحل التصنيع</h2><ol class="steps">${o.stages.map((s, i) => {
    const st = s.status === 'done' ? 'done' : s.status === 'active' ? 'active' : 'pending';
    const pct = total ? Math.min(100, Math.round((s.qty_done || 0) / total * 100)) : 0;
    return `<li class="${st}"><div class="d">${st === 'done' ? '✓' : i + 1}</div><div><div class="n">${esc(s.name)}</div>
      <div class="s">${st === 'done' ? 'خلصت ' + (s.finished_at ? dt(s.finished_at) : '') : st === 'active' ? 'شغالين فيها دلوقتي' + (s.qty_done ? ` — <span class="num">${s.qty_done}</span> من <span class="num">${total}</span> قطعة` : '') : i === firstPending ? 'الخطوة الجاية' : ''}</div>
      ${st === 'active' && s.qty_done ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}</div></li>`; }).join('')}</ol></div>
  ${o.updates.length ? `<div class="card"><h2>آخر التحديثات</h2>${o.updates.map(u => `<div class="up"><div><b>${esc(u.stage || 'تحديث')}</b>${u.qty_done ? ` · <span class="num">${u.qty_done}</span> قطعة` : ''}</div>${u.note ? `<div>${esc(u.note)}</div>` : ''}
      ${u.photos.length ? `<div class="ph">${u.photos.map(ph => `<img loading="lazy" src="${esc(photo(ph))}" alt="">`).join('')}</div>` : ''}<div class="w">${dt(u.at)}</div></div>`).join('')}</div>` : ''}
  ${o.photos.length ? `<div class="card"><h2>صور الأوردر</h2><div class="ph">${o.photos.map(ph => `<img loading="lazy" src="${esc(photo(ph))}" alt="">`).join('')}</div></div>` : ''}
  ${sizes.length ? `<div class="card"><h2>الكميات والمقاسات</h2><table>${sizes.map(z => `<tr><td>${esc(z.color || '')}</td><td class="num">${esc(z.size || '')}</td><td class="q"><span class="num">${z.qty}</span></td></tr>`).join('')}</table></div>` : ''}`;
  document.querySelectorAll('.ph img').forEach(im => im.onclick = () => { const z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = `<img src="${im.src}">`; z.onclick = () => z.remove(); document.body.appendChild(z); });
}
$('#f').onsubmit = e => { e.preventDefault(); const c = $('#code').value.trim(); if (c) load(c); };
const c0 = new URLSearchParams(location.search).get('c');
if (c0) { $('#code').value = c0; load(c0); }
</script>
</body>
</html>
